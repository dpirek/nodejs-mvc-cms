<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <div id="message_wrp"><div id="message_box" class="d-none"></div></div>
    <div class="container" style="max-width: 360px; margin-top: 20px;">
      <div id="content">
        <div class="clearfix">
          <form id="login_form" class="clearfix d-none" onsubmit="return false" method="post">
            <div class="p-3 border rounded">
              <legend>User Login</legend>
              <p>
                <label for="name">User Name</label>
                <input name="name" class="userName form-control" type="text">
              </p>
              <p>
                <label for="password">User Password:</label>
                <input type="password" name="password" class="form-control">
              </p>
              <div class="clearfix">
                <button class="btn btn-primary btn-lg submit">Submit</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="library/jquery/jquery.min.js" type="text/javascript"></script>
    <script src="library/jquery/jquery.tmpl.min.js" type="text/javascript"></script>
    <script src="library/jquery/jquery.MVC.js" type="text/javascript"></script>
    <script src="library/MVC.util.js" type="text/javascript"></script>
    <script src="library/MVC.util.string.js" type="text/javascript"></script>
    <script src="library/MVC.html.js" type="text/javascript"></script>
    <script src="library/MVC.service.js" type="text/javascript"></script>
    <script src="library/MVC.message.js" type="text/javascript"></script>
    <script src="library/MVC.session.js" type="text/javascript"></script>
    <script src="library/MVC.config.js" type="text/javascript"></script>

    <script type="text/javascript">
	(function(){
		var form = $('#login_form'),
				loginBtn = $('.submit', form);

			if($.browser.msie){
				form.html('<div><p style="text-align: center;"><strong>Your browser is not supported!</strong><br />Here are the supported browsers: Firefox, Chrome, Safari</p></div>');
			}

			form.fadeIn('slow');

		loginBtn.click(function(){

			var fromData = form.serialize();

				MVC.service.send({
					data: fromData,
					url: 'user/login',
		      success: function (d) {
		      	if(d.isSucessful){
		      		window.location = '/admin';
		      	} else {
		      		MVC.message.show({text: 'The login and password do not match!', hideDealy: 5000});
		      	}
		      }
		    });
			return false;
		});
	}());
    </script>
  </body>
</html>
