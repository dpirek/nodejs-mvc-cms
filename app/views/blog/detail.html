<!DOCTYPE html>
<html>
<head>
  <title>${blog.title}</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="alternate" type="application/rss+xml" href="/rss/" />
  <link type="text/css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>

<body class="${blog.url}">
  <div id="fb-root"></div>

  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">OdchodDoDuchodu.cz</a>
      <div class="navbar-collapse">
        {{html $item.htmlString(zone.nav)}}
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 72px; padding-bottom: 40px;">
    <div class="row g-4">
      <div class="col-md-6">
        <img src="/content/images/meeting-with-man.jpg" class="img-fluid" />
      </div>
      <div class="col-md-6">
        {{html $item.htmlString(zone.form2)}}
      </div>
    </div>

    <div class="row mt-4">
      <div class="col-12">
        <h1>${blog.title}</h1>
        <p><em>{{html $item.date(blog.date)}}</em></p>
        {{html $item.htmlString(blog.body)}}

        <div>
          <form action="/json/blog/createcomment" method="post">
            <input type="hidden" name="blogUrl" value="${blog.url}" />
            <p>
              <label class="form-label">email</label>
              <input name="email" class="form-control" />
            </p>
            <p>
              <label class="form-label">comment</label>
              <textarea name="comment" class="form-control"></textarea>
            </p>
            <div class="clearfix margin_bottom">
              <button class="btn btn-primary">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <hr />
    <footer>
      {{html $item.htmlString(zone.footer)}}
    </footer>
  </div>
</body>
</html>
